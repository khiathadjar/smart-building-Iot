<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLocate - Ajouter un objet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background: url('https://images.pexels.com/photos/4974912/pexels-photo-4974912.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') no-repeat center center fixed;
            background-size: cover;
            display: flex; 
            min-height: 100vh;
            margin: 0;
        }
        .glass-sidebar { background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(4px); }
        .form-card { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.3);
        }
    </style>
</head>
<body class="flex">
    <aside class="w-64 glass-sidebar min-h-screen text-gray-300 p-6 flex flex-col gap-6 shadow-2xl">
        <div class="text-2xl font-bold flex items-center gap-2 text-white">
            <i class="fas fa-wifi text-emerald-400"></i> IntelliBuild
        </div>
        <nav class="flex flex-col gap-4 mt-10">
            <a href="index.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition">
                <i class="fas fa-home"></i> Dashboard
            </a>
            <a href="ajouter-objet.html" class="bg-emerald-700 p-3 rounded-lg flex items-center gap-3 text-white shadow-lg">
                <i class="fas fa-plus"></i> Ajouter un objet
            </a>
            <a href="objets.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition">
                <i class="fas fa-cube"></i> Objets
            </a>
            <a href="localisations.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition">
                <i class="fas fa-map-marker-alt"></i> Localisations
            </a>
            <a href="parametres.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition mt-auto">
                <i class="fas fa-cog"></i> Paramètres
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex items-center justify-center p-6">
        <div class="form-card p-10 w-full max-w-lg">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">Ajouter un objet</h2>
                <p class="text-gray-500">Remplissez les informations de l'appareil</p>
            </div>

            <form id="addForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nom de l'objet</label>
                    <input type="text" id="objName" placeholder="Ex: Lampe Bureau..." required
                           class="w-full p-3 rounded-xl border border-gray-300 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Type</label>
                        <select id="objType" class="w-full p-3 rounded-xl border border-gray-300 bg-white">
                            <option>Lampe</option>
                            <option>Imprimante</option>
                            <option>Projecteur</option>
                            <option>Capteur</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Localisation</label>
                        <input type="text" id="objLoc" placeholder="Bureau 101" required
                               class="w-full p-3 rounded-xl border border-gray-300 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Description</label>
                    <textarea id="objDesc" rows="3" class="w-full p-3 rounded-xl border border-gray-300 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Statut</label>
                    <select id="objStatus" class="w-full p-3 rounded-xl border border-gray-300 bg-white">
                        <option value="active">Disponible</option>
                        <option value="inactive">Hors-ligne</option>
                    </select>
                </div>

                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="window.location.href='index.html'" class="flex-1 py-3 border rounded-xl">Annuler</button>
                    <button type="submit" class="flex-1 py-3 bg-emerald-700 text-white font-bold rounded-xl shadow-lg">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- 1. SÉCURITÉ (À mettre au tout début) ---
        const token = localStorage.getItem('userToken');
        if (!token) {
            window.location.href = "login.html";
        }

        // --- 2. ENVOI DES DONNÉES ---
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                name: document.getElementById('objName').value,
                type: document.getElementById('objType').value,
                location: document.getElementById('objLoc').value,
                description: document.getElementById('objDesc').value,
                status: document.getElementById('objStatus').value
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/things/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("✅ Objet enregistré !");
                    window.location.href = "index.html";
                } else {
                    alert("❌ Erreur serveur");
                }
            } catch (error) {
                alert("Erreur de connexion au serveur.");
            }
        });
    </script>
</body>
</html>
