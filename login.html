<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion – IntelliBuild</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

<header class="topbar">
  <h2><div class="logo">IntelliBuild</div></h2>
  <a href="p1.html" class="btn outline">Accueil</a>
</header>

<section class="auth-container">
  <div class="auth-box">
    <h2>Connexion</h2>
    <p>Accédez à votre plateforme Smart Building</p>

    <form id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="exemple@mail.com" required>

      <label>Mot de passe</label>
      <input id="loginPassword" type="password" placeholder="••••••••" required>

      <button type="submit" class="login-btn">Se connecter</button>
      <button type="button" class="forgot-btn">Mot de passe oublié ?</button>
    </form>
  </div>
</section>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const response = await fetch('http://127.0.0.1:8000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const result = await response.json();

            if (response.ok) {
                // On récupère le token (il peut être dans result ou result.session)
                const token = result.access_token || (result.session && result.session.access_token);
                localStorage.setItem('userToken', token);
                alert("Connexion réussie !");
                window.location.href = "index.html"; 
            } else {
                alert("Erreur : " + (result.detail || "Identifiants incorrects"));
            }
        } catch (error) {
            alert("Erreur de connexion au serveur.");
        }
    });
</script>
</body>
</html>
