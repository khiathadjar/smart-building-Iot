<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliBuild - Paramètres</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: url('https://images.pexels.com/photos/4974912/pexels-photo-4974912.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') no-repeat center center fixed; background-size: cover; }
        .glass-sidebar { background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(4px); }
        .glass-main { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="flex">
    <aside class="w-64 glass-sidebar min-h-screen text-gray-300 p-6 flex flex-col gap-6 shadow-2xl">
        <div class="text-2xl font-bold flex items-center gap-2 text-white">
            <i class="fas fa-wifi text-emerald-400"></i> IntelliBuild
        </div>
        <nav class="flex flex-col gap-4 mt-10">
            <a href="index.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition"><i class="fas fa-home"></i> Dashboard</a>
            <a href="ajouter-objet.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition"><i class="fas fa-plus"></i> Ajouter</a>
            <a href="objets.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition"><i class="fas fa-cube"></i> Objets</a>
            <a href="localisations.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition"><i class="fas fa-map-marker-alt"></i> Localisations</a>
            <a href="parametres.html" class="bg-emerald-700 p-3 rounded-lg flex items-center gap-3 text-white shadow-lg mt-auto"><i class="fas fa-cog"></i> Paramètres</a>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <div class="glass-main p-8 rounded-3xl shadow-2xl max-w-2xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-800 mb-8"><i class="fas fa-user-cog text-emerald-600 mr-2"></i>Mon Compte</h2>
            
            <div class="space-y-6">
                <div class="flex items-center justify-between p-4 bg-white/50 rounded-2xl border border-gray-200">
                    <div>
                        <p class="font-bold text-gray-800">Session Admin</p>
                        <p class="text-sm text-gray-500">Connecté en tant que gestionnaire</p>
                    </div>
                    <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-xl transition shadow-lg">
                        <i class="fas fa-sign-out-alt mr-2"></i> Déconnexion
                    </button>
                </div>

                <div class="p-6 bg-emerald-50 rounded-2xl border border-emerald-100 text-emerald-800">
                    <h4 class="font-bold mb-2">Statut du Serveur</h4>
                    <p class="text-sm flex items-center gap-2">
                        <span class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
                        Backend MongoDB : Opérationnel
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            localStorage.removeItem('userToken');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
