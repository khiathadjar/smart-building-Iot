<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliBuild - Localisations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { 
            background: url('https://images.pexels.com/photos/4974912/pexels-photo-4974912.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .glass-sidebar { background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(4px); }
        .glass-main { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="flex">
    <script>
        if (!localStorage.getItem('userToken')) window.location.href = "login.html";
    </script>

    <aside class="w-64 glass-sidebar min-h-screen text-gray-300 p-6 flex flex-col gap-6 shadow-2xl">
        <div class="text-2xl font-bold flex items-center gap-2 text-white">
            <i class="fas fa-wifi text-emerald-400"></i> IntelliBuild
        </div>
        <nav class="flex flex-col gap-4 mt-10">
            <a href="index.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition"><i class="fas fa-home"></i> Dashboard</a>
            <a href="ajouter-objet.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition"><i class="fas fa-plus"></i> Ajouter</a>
            <a href="objets.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition"><i class="fas fa-cube"></i> Objets</a>
            <a href="localisations.html" class="bg-emerald-700 p-3 rounded-lg flex items-center gap-3 text-white shadow-lg"><i class="fas fa-map-marker-alt"></i> Localisations</a>
            <a href="parametres.html" class="p-3 hover:bg-gray-800 rounded-lg flex items-center gap-3 transition mt-auto"><i class="fas fa-cog"></i> Paramètres</a>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <div class="glass-main p-8 rounded-3xl shadow-2xl">
            <h2 class="text-3xl font-bold text-gray-800 mb-6 flex items-center gap-3">
                <i class="fas fa-map-marked-alt text-emerald-600"></i> Zones Détectées
            </h2>
            
            <div id="locGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
        </div>
    </main>

    <script>
        async function chargerLocalisations() {
            try {
                const response = await fetch('http://127.0.0.1:8000/things/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ search_query: "" })
                });
                const items = await response.json();
                
                // On extrait les noms de pièces uniques
                const rooms = [...new Set(items.map(item => item.location?.room || item.location))];
                
                const grid = document.getElementById('locGrid');
                grid.innerHTML = rooms.map(room => `
                    <div class="bg-white p-6 rounded-2xl border border-emerald-100 shadow-lg hover:scale-105 transition transform">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-emerald-600 rounded-xl flex items-center justify-center text-white text-2xl">
                                <i class="fas fa-door-open"></i>
                            </div>
                            <div>
                                <h3 class="text-xl font-bold text-gray-800">${room}</h3>
                                <p class="text-sm text-emerald-600 font-semibold">Zone active</p>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) { console.error(error); }
        }
        window.onload = chargerLocalisations;
    </script>
</body>
</html>
